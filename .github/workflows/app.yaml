name: CI/CD for django sample app

on:
  push:
    branches:
      - "feature/*"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9" # Specify your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: List files for debugging
        run: ls -R
      - name: Run migrations
        working-directory: ./app
        env:
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          python manage.py migrate

  build-and-push:
    needs: [lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }} # Use owner/org name
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push web Image to GHCR and Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/app:latest
            ghcr.io/${{ github.repository_owner }}/app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/app:latest

      - name: Build and Push nginx Image to GHCR and Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/r-proxy:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/r-proxy:latest
            ghcr.io/${{ github.repository_owner }}/r-proxy:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/r-proxy:latest

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH on EC2
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Copy docker-compose.yml to EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          if [ ! -f /home/${{ secrets.SSH_USER }}/docker-compose.yml ]; then
            echo "docker-compose.yml not found. Copying file..."
            exit 1
          else
            echo "docker-compose.yml already exists. Skipping copy."
          fi
          EOF
          scp -i key.pem -o StrictHostKeyChecking=no docker-compose.yml ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SSH_USER }}/

      - name: Copy docker setup script to EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          if [ ! -f /home/${{ secrets.SSH_USER }}/setup-docker.sh ]; then
            echo "setup-docker.sh not found. Copying file..."
            exit 1
          else
            echo "setup-docker.sh already exists. Skipping copy."
          fi
          EOF
          scp -i key.pem -o StrictHostKeyChecking=no setup-docker.sh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/${{ secrets.SSH_USER }}/

      - name: Run docker setup script on EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          if ! command -v docker &> /dev/null; then
            echo "Docker is not installed. Running setup script..."
            sudo chmod +x /home/${{ secrets.SSH_USER }}/setup-docker.sh
            sudo /home/${{ secrets.SSH_USER }}/setup-docker.sh
          else
            echo "Docker is already installed. Skipping setup."
          fi
          EOF

      - name: Deploy to EC2
        run: |
          ssh -i key.pem -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          docker login -u ${{ secrets.DOCKERHUB_USERNAME }} -p ${{ secrets.DOCKERHUB_TOKEN }}
          if ! docker images | grep -q "${{ secrets.DOCKERHUB_USERNAME }}/app"; then
            echo "Pulling app image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app:latest
          else
            echo "App image already exists. Skipping pull."
          fi
          if ! docker images | grep -q "${{ secrets.DOCKERHUB_USERNAME }}/r-proxy"; then
            echo "Pulling r-proxy image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/r-proxy:latest
          else
            echo "r-proxy image already exists. Skipping pull."
          fi
          docker-compose -f /home/${{ secrets.SSH_USER }}/docker-compose.yml up -d
          EOF
