name: CI/CD for Django App to Heroku

on:
  push:
    branches:
      - main # Or your primary deployment branch, e.g., master
      - "feature/*" # Keep if you want to run lint/test on feature branches
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # Match your app's Python version (e.g., from runtime.txt)

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run linting (flake8)
        working-directory: ./app
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    services: # Optional: Add a PostgreSQL service for testing if your tests require it
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: ./app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: ./app
        env:
          # --- For SQLite testing (simpler, if your tests don't need PostgreSQL features) ---
          # DJANGO_SETTINGS_MODULE: core.settings # Ensure settings can default to SQLite if DATABASE_URL is not set
          # --- For PostgreSQL testing (using the service above) ---
          DATABASE_URL: postgres://testuser:testpassword@localhost:5432/testdb
          SECRET_KEY: "test_secret_key_for_gha" # Dummy secret key for tests
          DEBUG: "1"
          # Add any other environment variables your tests might need
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py test

