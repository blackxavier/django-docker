version: "3.8"

services:
  web:
    image: ${DOCKERHUB_USERNAME}/app:latest # From Docker Hub
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    containter_name: web
    networks:
      - backend
    depends_on:
      - db
      - redis
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./var/www/static:/home/app/web/staticfiles
      - ./var/www/media:/home/app/web/mediafiles
    expose:
      - 8000
    env_file:
      - ./.env.server.prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
  r-proxy:
    #build: ./nginx
    image: ${DOCKERHUB_USERNAME}/r-proxy:latest
    ports:
      - 80:80
    volumes:
      - static_volume:/home/app/web/staticfiles
      - media_volume:/home/app/web/mediafiles
    depends_on:
      - web

  redis:
    image: redis
    networks:
      - backend

  adminer:
    image: adminer
    networks:
      - backend
    restart: always
    ports:
      - 8080:8080

  dozzle:
    networks:
      - backend
    container_name: dozzle
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9999:8080"

  pgadmin:
    networks:
      - backend
    container_name: pgadmin
    image: dpage/pgadmin4:latest
    env_file:
      - ./.env.db.prod
    environment:
      - PGADMIN_CONFIG_LOGIN_BANNER="Authorisedusers"
    ports:
      - "5050:80"
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  backend:
    driver: bridge
